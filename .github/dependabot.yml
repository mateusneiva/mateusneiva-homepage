version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: react-icons
        update-types: [version-update:semver-minor, version-update:semver-patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
